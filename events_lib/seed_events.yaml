#   ① tag 含"公开数据待复核"：来自公开报道的硬数字，雅虎恢复后用
#     scripts/backfill_events.py 实测复核；② tag 含"2026-09复盘实测"：本仓实测。
# - 正负事件配平（正向 8 条），防止类比永远偏空；单一公告日归因。
# - v1.3 新增三类对照（评审 P1-2：防"全是咬人的狗"高估冲击）：
#   ① fizzled=true：雷声大雨点小的对照事件，浅回撤参与 base-rate 平均修正高估；
#   ② 快速收复危机：真实冲击但 V 型，修正"恢复天数"的悲观估计；
#   ③ 机制类比（pre-2018）：产业结构已变，仅机制层面可比，tags 显式标注。
# - pre-state（事件前状态）字段由 scripts/backfill_pre_state.py 回填，人工不填。
